name: Build Android APK

on:
  push:
    paths:
      - 'atelier/**'
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: |
          npm run build:web
          npx cap add android
          node scripts/patch-android.mjs
          npx @capacitor/assets generate --android --iconBackgroundColor '#161513' --splashBackgroundColor '#f6f3ee'
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Atelier.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Atelier-apk
          path: mobile/Atelier.apk

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/Atelier.apk
